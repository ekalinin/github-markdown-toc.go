name: e2e test

on:
  schedule:
    # once a week, on mondays at 7:30am
    - cron: "30 7 * * 1,4"

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"

      - name: Run converting
        run: make e2e
        env:
          GH_TOC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
