version: 2
project_name: gh-md-toc
before:
  hooks:
    # Verify the module files are tidy without mutating them mid-release.
    - go mod tidy -diff
builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd/gh-md-toc
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^Makefile:'
      - '^README:'
      - '^gitignore:'
      - '^goreleaser:'
